<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Alzi</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600&family=Inter:wght@400;500&family=Caveat&display=swap"
    />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        background: oklch(0.955 0.003 240);
        color: oklch(0.18 0.01 250);
        font-family: Inter, system-ui, sans-serif;
      }
      .note {
        margin: 0;
        font: 2.25rem Caveat, cursive;
        color: oklch(0.62 0.18 28);
      }
      h1 {
        margin: 8px 0 12px;
        font: 600 3rem/1.05 "Inter Tight", Inter, sans-serif;
        letter-spacing: -0.02em;
      }
      p {
        color: oklch(0.42 0.01 250);
      }
      a {
        display: inline-block;
        margin-top: 12px;
        padding: 12px 20px;
        border-radius: 999px;
        background: oklch(0.18 0.01 250);
        color: oklch(0.98 0.002 240);
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="note">oh no —</p>
      <h1>Page not found</h1>
      <p>This page doesn't exist or has been moved.</p>
      <a href="/">Go home</a>
    </main>
  </body>
</html>
